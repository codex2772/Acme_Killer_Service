spring:
  application:
    name: jewel-erp

  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jewelerpdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:jeweladmin}
    password: ${DB_PASSWORD:jewelpass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Flyway Migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # File upload limits
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  shutdown: graceful

# Actuator for K8s health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# App info
info:
  app:
    name: JewelERP
    description: Cloud-native Jewelry Management System
    version: '@project.version@'

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:jewel-erp-default-dev-secret-key-change-in-production-min-256-bits}
  expiration-ms: 86400000       # 24 hours
  refresh-expiration-ms: 604800000  # 7 days

# AWS S3 Configuration
aws:
  s3:
    bucket: ${S3_BUCKET_NAME:jewel-erp-images-ap-south-1}
    region: ${S3_REGION:ap-south-1}

# Razorpay Payment Gateway Configuration
razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
  key-secret: ${RAZORPAY_KEY_SECRET:test_secret_placeholder}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:webhook_secret_placeholder}

# WhatsApp Messaging (Meta Cloud API direct; MSG91 provider is a future drop-in)
whatsapp:
  enabled: ${WHATSAPP_ENABLED:false}          # global kill-switch
  provider: ${WHATSAPP_PROVIDER:meta}         # meta | msg91 (future)
  default-channel: WHATSAPP
  # Per-store token storage: 'local' (AES-encrypted in DB) or 'secrets-manager' (AWS, prod)
  token-store: ${WABA_TOKEN_STORE:local}
  # Encrypts per-store access tokens at rest (local store only)
  token-encryption-key: ${WABA_TOKEN_ENCRYPTION_KEY:change-me-waba-token-encryption-key}
  # Secrets Manager name prefix, full name is <prefix>/<storeId> (secrets-manager store only)
  token-secret-prefix: ${WABA_SECRET_PREFIX:jewel-erp/local/waba}
  meta:
    graph-base-url: ${META_GRAPH_URL:https://graph.facebook.com/v21.0}
    app-id: ${META_APP_ID:placeholder}
    app-secret: ${META_APP_SECRET:placeholder}
    webhook-verify-token: ${META_WEBHOOK_VERIFY_TOKEN:placeholder}

# Messaging dispatch
messaging:
  async-pool-size: ${MESSAGING_ASYNC_POOL:4}

